    <text x="41" y="341" class="small strong" fill="#72420e">1 个岗位即将截止</text>
    <text x="165" y="341" class="small" fill="#92632d">未来 7 天内，记得及时投递。</text>

    <rect x="24" y="374" width="371" height="42" rx="10" fill="#fff" stroke="#cfd5cd"/>
    <circle cx="43" cy="395" r="5" fill="none" stroke="#68736c"/>
    <path d="m47 399 4 4" stroke="#68736c"/>
    <text x="61" y="400" class="small muted">搜索公司、岗位或城市</text>
    <rect x="407" y="374" width="124" height="42" rx="10" fill="#fff" stroke="#cfd5cd"/>
    <text x="425" y="400" class="small" fill="#17211b">全部进度</text>
    <path d="m513 392 4 4 4-4" fill="none" stroke="#68736c"/>
    <rect x="541" y="374" width="55" height="42" rx="10" fill="#fff" stroke="#dfe4dc"/>
    <text x="568" y="400" text-anchor="middle" class="small strong" fill="#17211b">筛选</text>
  </g>

  <g class="ui">
    <g transform="translate(24 434)">
      <rect width="183" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#89948c"/>
      <text x="28" y="26" class="label" fill="#17211b">待投递</text>
      <circle cx="164" cy="22" r="10" fill="#fff"/>
      <text x="164" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="163" height="163" rx="10" fill="#fff" stroke="#e0e4de"/>
      <rect x="10" y="42" width="163" height="3" rx="2" fill="#e9944a"/>
      <rect x="22" y="56" width="51" height="18" rx="9" fill="#fff0df"/>
      <text x="47" y="68" text-anchor="middle" font-size="8" fill="#8b4d18">高优先级</text>
      <text x="22" y="96" class="small strong" fill="#17211b">AI 应用开发实习生</text>
      <text x="22" y="114" class="tiny muted">青桐智能 · 苏州</text>
      <text x="22" y="145" class="tiny muted">截止</text>
      <text x="150" y="145" text-anchor="end" class="tiny strong" fill="#17211b">07 月 30 日</text>
      <rect x="22" y="160" width="139" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="179" class="tiny muted">移至：待投递</text>
    </g>

    <g transform="translate(218 434)">
      <rect width="183" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#4a82da"/>
      <text x="28" y="26" class="label" fill="#17211b">已投递</text>
      <circle cx="164" cy="22" r="10" fill="#fff"/>
      <text x="164" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="163" height="145" rx="10" fill="#fff" stroke="#e0e4de"/>
      <rect x="10" y="42" width="163" height="3" rx="2" fill="#e9944a"/>
      <rect x="22" y="56" width="51" height="18" rx="9" fill="#fff0df"/>
      <text x="47" y="68" text-anchor="middle" font-size="8" fill="#8b4d18">高优先级</text>
      <text x="22" y="96" class="small strong" fill="#17211b">Python 开发实习生</text>
      <text x="22" y="114" class="tiny muted">星河科技 · 南京</text>
      <rect x="22" y="140" width="139" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="159" class="tiny muted">移至：已投递</text>
    </g>

    <g transform="translate(412 434)">
      <rect width="183" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#9e6bd2"/>
      <text x="28" y="26" class="label" fill="#17211b">笔试</text>
      <circle cx="164" cy="22" r="10" fill="#fff"/>
      <text x="164" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="163" height="133" rx="10" fill="#fff" stroke="#e0e4de"/>
      <text x="22" y="77" class="small strong" fill="#17211b">数据分析实习生</text>
      <text x="22" y="95" class="tiny muted">远山数据 · 上海</text>
      <rect x="22" y="128" width="139" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="147" class="tiny muted">移至：笔试</text>
    </g>

    <g transform="translate(606 434)">
      <rect width="183" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#e9944a"/>
      <text x="28" y="26" class="label" fill="#17211b">面试</text>
      <circle cx="164" cy="22" r="10" fill="#fff"/>
      <text x="164" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="163" height="145" rx="10" fill="#fff" stroke="#e0e4de"/>
      <rect x="10" y="42" width="163" height="3" rx="2" fill="#e9944a"/>
      <text x="22" y="82" class="small strong" fill="#17211b">后端开发实习生</text>
      <text x="22" y="100" class="tiny muted">云帆网络 · 杭州</text>
      <rect x="22" y="140" width="139" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="159" class="tiny muted">移至：面试</text>
    </g>

    <g transform="translate(800 434)">
      <rect width="183" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#176b4d"/>
      <text x="28" y="26" class="label" fill="#17211b">Offer</text>
      <circle cx="164" cy="22" r="10" fill="#fff"/>
      <text x="164" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="163" height="133" rx="10" fill="#fff" stroke="#e0e4de"/>
      <text x="22" y="77" class="small strong" fill="#17211b">软件工程实习生</text>
      <text x="22" y="95" class="tiny muted">海岸互联 · 远程</text>
      <rect x="22" y="128" width="139" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="147" class="tiny muted">移至：Offer</text>
    </g>

    <g transform="translate(994 434)">
      <rect width="185" height="219" rx="13" fill="#ecefea" stroke="#dfe4dc"/>
      <circle cx="17" cy="22" r="4" fill="#a65454"/>
      <text x="28" y="26" class="label" fill="#17211b">已结束</text>
      <circle cx="166" cy="22" r="10" fill="#fff"/>
      <text x="166" y="26" text-anchor="middle" class="tiny muted">1</text>
      <rect x="10" y="42" width="165" height="133" rx="10" fill="#fff" stroke="#e0e4de"/>
      <text x="22" y="77" class="small strong" fill="#17211b">测试开发实习生</text>
      <text x="22" y="95" class="tiny muted">方舟软件 · 南京</text>
      <rect x="22" y="128" width="141" height="29" rx="7" fill="#fafbf8" stroke="#e2e6df"/>
      <text x="31" y="147" class="tiny muted">移至：已结束</text>
    </g>
