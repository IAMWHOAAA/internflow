<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">InternFlow 投递工作台预览</title>
  <desc id="desc">包含投递统计、搜索筛选和六阶段求职看板的产品界面</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f3027" flood-opacity=".08"/>
    </filter>
    <style>
      .ui { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", serif; }
      .muted { fill: #68736c; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .label { font-size: 11px; font-weight: 700; }
      .body { font-size: 13px; }
      .strong { font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="22" fill="#f6f7f2"/>
  <rect width="1200" height="64" rx="22" fill="#fafbf8"/>
  <path d="M0 42h1200v22H0z" fill="#fafbf8"/>
  <path d="M0 64h1200" stroke="#dfe4dc"/>

  <g class="ui">
    <rect x="24" y="14" width="36" height="36" rx="11" fill="#176b4d" transform="rotate(-3 42 32)"/>
    <text x="42" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#dff257">IF</text>
    <text x="70" y="39" font-size="18" font-weight="800" fill="#17211b">InternFlow</text>
    <text x="1028" y="37" class="small muted">demo</text>
    <rect x="1071" y="17" width="54" height="32" rx="10" fill="#fff" stroke="#dfe4dc"/>
    <text x="1098" y="38" text-anchor="middle" class="small strong" fill="#17211b">工作台</text>
    <rect x="1135" y="17" width="44" height="32" rx="10" fill="#fff" stroke="#dfe4dc"/>
    <text x="1157" y="38" text-anchor="middle" class="small strong" fill="#17211b">退出</text>
  </g>

  <g class="ui">
    <rect x="24" y="94" width="21" height="2" fill="#176b4d"/>
    <text x="53" y="100" class="tiny strong" fill="#176b4d" letter-spacing="1">求职进度</text>
    <text x="24" y="147" class="serif" font-size="35" fill="#17211b">你好，demo</text>
    <text x="24" y="173" class="small muted">把注意力留给真正重要的下一步。</text>
    <rect x="1058" y="124" width="121" height="40" rx="11" fill="#176b4d" filter="url(#shadow)"/>
    <text x="1118" y="149" text-anchor="middle" class="small strong" fill="#fff">＋ 新增投递</text>
  </g>

  <g class="ui" filter="url(#shadow)">
    <g>
      <rect x="24" y="199" width="275" height="101" rx="14" fill="#fff" stroke="#dfe4dc"/>
      <text x="43" y="225" class="tiny muted">全部记录</text>
      <text x="43" y="263" class="serif" font-size="32" fill="#17211b">6</text>
      <text x="43" y="284" class="tiny muted">累计跟进</text>
    </g>
    <g>
      <rect x="313" y="199" width="275" height="101" rx="14" fill="#fff" stroke="#dfe4dc"/>
      <text x="332" y="225" class="tiny muted">进行中</text>
      <text x="332" y="263" class="serif" font-size="32" fill="#17211b">4</text>
      <text x="332" y="284" class="tiny muted">需要关注</text>
    </g>
    <g>
      <rect x="602" y="199" width="275" height="101" rx="14" fill="#fff" stroke="#dfe4dc"/>
      <text x="621" y="225" class="tiny muted">面试阶段</text>
      <text x="621" y="263" class="serif" font-size="32" fill="#17211b">1</text>
      <text x="621" y="284" class="tiny muted">准备表达</text>
    </g>
    <g>
      <rect x="891" y="199" width="288" height="101" rx="14" fill="#176b4d"/>
      <circle cx="1163" cy="298" r="72" fill="none" stroke="#dff257" stroke-opacity=".14" stroke-width="22"/>
      <text x="910" y="225" class="tiny" fill="#fff" opacity=".68">收到 Offer</text>
      <text x="910" y="263" class="serif" font-size="32" fill="#fff">1</text>
      <text x="910" y="284" class="tiny" fill="#fff" opacity=".68">继续加油</text>
    </g>
  </g>

  <g class="ui">
